name: Folia 1.21.11 Runtime Smoke Test

on:
  push:
    branches:
      - "sync/worldedit-3051*"
  pull_request:
    branches:
      - "folia/1.21.11"

permissions:
  contents: read

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build WorldEdit candidate
        run: ./gradlew --no-daemon :worldedit-bukkit:build

      - name: Download Folia 1.21.11 and install exact candidate
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          API="https://fill.papermc.io/v3/projects/folia/versions/1.21.11/builds"
          USER_AGENT="CyoriaSMP-GitHub-Actions/1.0 (https://cytechteam.dev)"
          BUILDS_JSON="$(curl -fsSL -H "User-Agent: $USER_AGENT" "$API")"
          BUILD="$(jq -r 'first(.[] | select(.channel == "STABLE") | .id) // "null"' <<< "$BUILDS_JSON")"
          DOWNLOAD_URL="$(jq -r 'first(.[] | select(.channel == "STABLE") | .downloads."server:default".url) // "null"' <<< "$BUILDS_JSON")"
          SHA256="$(jq -r 'first(.[] | select(.channel == "STABLE") | .downloads."server:default".checksums.sha256) // "null"' <<< "$BUILDS_JSON")"
          test -n "$BUILD" && test "$BUILD" != "null"
          test -n "$DOWNLOAD_URL" && test "$DOWNLOAD_URL" != "null"
          test -n "$SHA256" && test "$SHA256" != "null"
          mkdir -p runtime/plugins
          curl -fL "$DOWNLOAD_URL" -o runtime/folia.jar
          echo "$SHA256  runtime/folia.jar" | sha256sum -c -
          JAR="$(find worldedit-bukkit/build/libs -maxdepth 1 -type f -name 'worldedit-bukkit-*.jar' ! -name '*sources*' ! -name '*javadoc*' | head -n 1)"
          test -n "$JAR"
          cp "$JAR" runtime/plugins/WorldEdit.jar
          printf 'eula=true\n' > runtime/eula.txt
          cat > runtime/server.properties <<'PROPERTIES'
          motd=CyoriaSMP Folia 1.21.11 WorldEdit runtime smoke
          server-ip=127.0.0.1
          server-port=25565
          online-mode=false
          max-players=1
          view-distance=2
          simulation-distance=2
          spawn-protection=0
          level-name=world
          PROPERTIES
          {
            echo "commit=$CANDIDATE_SHA"
            echo "folia_version=1.21.11"
            echo "folia_build=$BUILD"
            echo "plugin_jar=$JAR"
            sha256sum runtime/plugins/WorldEdit.jar
          } | tee runtime/evidence.txt

      - name: Start Folia and verify WorldEdit loads
        shell: bash
        run: |
          set -euo pipefail
          cd runtime
          java -Xms1G -Xmx2G -jar folia.jar --nogui > folia.log 2>&1 &
          PID=$!
          trap 'kill -TERM "$PID" 2>/dev/null || true; wait "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 120); do
            if grep -q "Done (" folia.log; then break; fi
            if ! kill -0 "$PID" 2>/dev/null; then cat folia.log; exit 1; fi
            sleep 2
          done
          grep -q "Done (" folia.log
          grep -Fq "[WorldEdit] Enabling WorldEdit" folia.log
          if grep -E "Could not load 'plugins/WorldEdit.jar'|Error occurred while enabling WorldEdit|\[WorldEdit\].*Severe Error" folia.log; then
            exit 1
          fi

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worldedit-folia-1.21.11-runtime-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            runtime/folia.log
            runtime/evidence.txt
          if-no-files-found: warn
          retention-days: 30
