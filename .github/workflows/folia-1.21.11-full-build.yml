name: Folia 1.21.11 Full Build and API Compatibility

on:
  push:
    branches:
      - "sync/worldedit-3051*"
  pull_request:
    branches:
      - "folia/1.21.11"

permissions:
  contents: read

concurrency:
  group: worldedit-folia-full-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3
      - name: Build, test, and verify Bukkit API compatibility
        run: ./gradlew build --no-daemon --stacktrace
